name: Deploy SharpWork

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DATABASE_URL: postgresql://sharpwork:sharpwork123@localhost:5432/sharpwork?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-test-access-secret
  JWT_REFRESH_SECRET: ci-test-refresh-secret
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: sharpwork
          POSTGRES_PASSWORD: sharpwork123
          POSTGRES_DB: sharpwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharpwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        run: cd apps/api && npx prisma generate && npx prisma migrate deploy

      - name: Type Check & Lint
        run: npx turbo run check-types lint

      - name: Run Unit & Integration Tests
        run: cd apps/api && npm test

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: cd apps/web && npm run build

      - name: Run Lighthouse CI
        run: cd apps/web && npm run lighthouse

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci

  build-and-push-docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, admin]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image tag
        id: image
        run: echo "tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.app }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

  production-checklist:
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production checklist script
        run: |
          chmod +x scripts/production-checklist.sh
          DATABASE_URL=postgresql://x REDIS_URL=redis://x \
          JWT_ACCESS_SECRET=x JWT_REFRESH_SECRET=x \
          WEB_APP_URL=http://localhost:3002 API_PUBLIC_URL=http://localhost:4000 \
          bash -c 'source /dev/null; grep -q "Production Launch Checklist" scripts/production-checklist.sh'

  build-expo:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_EXPO_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Dependencies
        run: npm ci
      - name: Build Android App
        working-directory: ./apps/mobile
        run: eas build --platform android --profile production --non-interactive
