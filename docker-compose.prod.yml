services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: sharpwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharpwork123}
      POSTGRES_DB: sharpwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sharpwork']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sharpwork:${POSTGRES_PASSWORD:-sharpwork123}@postgres:5432/sharpwork?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3002}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_WEB_URL: ${WEB_APP_URL:-http://localhost:3002}
    ports:
      - '3002:3002'
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    ports:
      - '3001:3001'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
