# Deprecated: use root railway.toml (repo root) for all services.
# Kept for reference if you set Config path to apps/api/railway.toml.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "package.json",
  "package-lock.json",
  "nixpacks.toml",
  "railpack.json",
]

[deploy]
startCommand = "npm run start:api"
preDeployCommand = "npm run db:setup"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
