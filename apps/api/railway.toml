# Railway service: name this service "api" (required for web/admin private networking).
# Root directory for all three services: repository root (.)
# Config path (Settings → Config-as-code): apps/api/railway.toml

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "package.json",
  "package-lock.json",
  "nixpacks.toml",
  "railpack.json",
]

[deploy]
startCommand = "npm run start:api"
preDeployCommand = "npm run db:setup"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
