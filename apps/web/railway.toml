# Railway service: name this service "web"
# Root directory: repository root (.)
# Config path: apps/web/railway.toml

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:web"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json",
  "package-lock.json",
  "nixpacks.toml",
  "railpack.json",
]

[deploy]
startCommand = "npm run start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
# Web proxies /backend → api.railway.internal:4000 (no NEXT_PUBLIC_API_URL needed)
