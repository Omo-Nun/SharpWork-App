# Deprecated: use root railway.toml (repo root) for all services.
# Kept for reference if you set Config path to apps/web/railway.toml.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:web"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json",
  "package-lock.json",
  "nixpacks.toml",
  "railpack.json",
]

[deploy]
startCommand = "npm run start --workspace=web"
# healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
