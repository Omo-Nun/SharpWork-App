# Railway service: name this service "admin"
# Root directory: repository root (.)
# Config path: apps/admin/railway.toml

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:admin"
watchPatterns = [
  "apps/admin/**",
  "packages/**",
  "package.json",
  "package-lock.json",
  "nixpacks.toml",
  "railpack.json",
]

[deploy]
startCommand = "npm run start:admin"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3001"
