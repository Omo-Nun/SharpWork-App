services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sharpwork_db
    environment:
      POSTGRES_USER: sharpwork
      POSTGRES_PASSWORD: sharpwork123
      POSTGRES_DB: sharpwork
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sharpwork_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
